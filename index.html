<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a0f17"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>مِرقَام | MIRQAAM</title>
<style>
:root{--bg:#2a0f17;--card:#3d1623;--btn:#c9a24a;--text:#f5ecd9;--icon:#c9a24a;--sub:#8c3a4e;--fs:17px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.6 "Segoe UI",Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:.3em 0;color:var(--icon)}.muted{color:var(--sub)}main{max-width:900px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--sub);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 6px 18px #0006}
.hero{background:linear-gradient(135deg,var(--sub),var(--card) 55%,var(--bg));border:1px solid var(--btn);border-radius:24px;padding:20px;text-align:center}
.hero .gold{color:var(--btn);font-weight:bold;font-size:1.5em}.line{height:2px;background:var(--btn);margin:8px auto;width:60%}
button,.b{background:var(--btn);color:var(--bg);border:0;border-radius:12px;padding:9px 14px;font:inherit;font-weight:bold;cursor:pointer}
button.g{background:none;color:var(--text);border:1px solid var(--sub)}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--sub);border-radius:10px;padding:8px;font:inherit}
label{display:block;margin:8px 0 2px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bar{height:14px;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--sub)}.bar i{display:block;height:100%;background:var(--btn)}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--sub);display:flex;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;color:var(--text);flex:0 0 auto;min-width:74px;font-size:.8em;padding:6px}nav button.on{background:var(--btn);color:var(--bg)}
dialog{background:var(--card);color:var(--text);border:1px solid var(--btn);border-radius:18px;width:min(92vw,480px)}dialog::backdrop{background:#000a}
.big{font-size:2em;font-weight:bold;color:var(--btn);text-align:center}.charts{display:flex;align-items:flex-end;gap:6px;height:130px}
.charts div{flex:1;text-align:center;font-size:.7em}.charts i{display:block;background:var(--btn);border-radius:6px 6px 0 0;min-height:2px}
#sp{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;transition:opacity 1.2s}
#sp b{font-size:3.4em;color:var(--btn)}.hide{opacity:0;pointer-events:none}
</style></head><body>
<div id="sp"><div style="font-size:6em;color:var(--btn)">م</div><b>مِرقَام</b><div style="letter-spacing:6px">MIRQAAM</div><p>مِرقَام… لأن لكل إنجاز بداية، ولكل هدف طريق.</p></div>
<main id="app"></main><nav id="nav"></nav><dialog id="dlg"></dialog>
<script>
const TAG="مِرقَام… لأن لكل إنجاز بداية، ولكل هدف طريق.",KEY="mirqaam_v1";
const TH={"برغندي":{bg:"#2a0f17",card:"#3d1623",btn:"#c9a24a",text:"#f5ecd9",icon:"#c9a24a",sub:"#8c3a4e"},"ليلي":{bg:"#0e0e10",card:"#1a1a1e",btn:"#d4af37",text:"#f2f2f2",icon:"#d4af37",sub:"#3a3a42"},"نهاري":{bg:"#f6f1e7",card:"#fffaf0",btn:"#7b1e3a",text:"#2b1a1f",icon:"#7b1e3a",sub:"#d9c7a3"},"محيط":{bg:"#0b1f2e",card:"#12324a",btn:"#38bdf8",text:"#eaf6ff",icon:"#38bdf8",sub:"#2c5d7c"},"غابة":{bg:"#0f2418",card:"#173524",btn:"#7ddc8a",text:"#ecf8ee",icon:"#7ddc8a",sub:"#2f6b45"},"بنفسجي":{bg:"#1c1030",card:"#2a1a48",btn:"#c084fc",text:"#f3eaff",icon:"#c084fc",sub:"#5b3a96"}};
const CL={bg:"لون الخلفية",card:"لون البطاقات",btn:"لون الأزرار",text:"لون النصوص",icon:"لون الأيقونات",sub:"لون العناصر الثانوية"};
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],MON=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const ST=["لم تبدأ","قيد التنفيذ","مكتملة"],PR={عالية:"🔴",متوسطة:"🟡",منخفضة:"🟢"};
const Q=[["تحفيز","ابدأ الآن بما تستطيع، فالبداية الصغيرة أفضل من الانتظار الكبير."],["تحفيز","كل صفحة تنهيها اليوم تخفف عنك عبء الغد."],["تحفيز","اصنع من تعبك اليوم قصة فخر ترويها لنفسك غدًا."],["حكمة","قليل دائم خير من كثير منقطع."],["حكمة","من رتّب يومه رتّب مستقبله."],["صبر","الجبل يُقطع بخطوة بعد خطوة."],["صبر","الصبر الجميل هدوء في القلب وجدّ في اليدين."],["علم","اسأل ولا تخجل، فالسؤال أول أبواب المعرفة."],["علم","ما تفهمه بعمق يبقى معك أطول مما تحفظه بسرعة."],["تفاؤل","بعد كل ليلة طويلة فجر يستحق الانتظار."],["تفاؤل","حين تبتسم للصعوبة تفقد نصف قوتها."],["اجتهاد","النجاح عادة يومية صغيرة تتراكم بصمت."],["اجتهاد","إنجاز صغير كل يوم أجمل من خطة كبيرة مؤجلة."],["الوقت","من احترم دقائقه كبرت أيامه."],["شعر","تفاءل فإن الليل مهما تطاولا ❖ سينجاب والفجر الجميل تهللا"],["شعر","إذا اشتد ضيق فانتظر فرجًا قريبا ❖ فبعد العسر يسر يملأ القلب طيبا"],["شعر","اصبر على مر الدروس فإنما ❖ تحلو الثمار لمن صبر وتجلدا"],["شعر","والصبر كالغيث الذي إن تأخرا ❖ أحيا الربى وكسا الصحارى أخضرا"],["شعر","اطلب العلم فإن العلم نور ❖ يهدي الخطى ويزيل ظلمة الغرور"],["شعر","جدّ واجتهد فالمجد غاية من سعى ❖ وبه تنال الرفعة العليا والمنى"]];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEF=()=>({name:"",theme:"برغندي",custom:null,fs:17,tasks:[],folders:[],lessons:[],sess:[],favs:[],clog:[],nid:1,active:null,
counters:["كم تمريناً حللت؟|تمرين","كم فقرة حفظت؟|فقرة","كم درساً أنجزت؟|درس","كم صفحة درست؟|صفحة","كم ساعة درست؟|ساعة"].map((x,i)=>({id:i+1,name:x.split("|")[0],unit:x.split("|")[1],v:0}))});
let S;try{S=Object.assign(DEF(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=DEF()}
let bt;const snap=()=>{try{const b=JSON.parse(localStorage.getItem(KEY+"_bk")||"[]");b.push({t:Date.now(),d:JSON.stringify(S)});while(b.length>3)b.shift();localStorage.setItem(KEY+"_bk",JSON.stringify(b))}catch(e){}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("تعذر الحفظ على هذا الجهاز")}clearTimeout(bt);bt=setTimeout(snap,5000)};
const id=()=>S.nid++,today=()=>new Date().toLocaleDateString("en-CA"),
dstr=s=>{const d=new Date(s+"T12:00:00");return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()} م`},
hms=s=>{s=Math.floor(s);return [s/3600,s%3600/60,s%60].map(x=>String(Math.floor(x)).padStart(2,"0")).join(":")};
function theme(){const t=Object.assign({},TH["برغندي"],S.theme==="مخصص"?S.custom:TH[S.theme]);for(const k in t)document.documentElement.style.setProperty("--"+k,t[k]);document.documentElement.style.setProperty("--fs",S.fs+"px");document.querySelector("meta[name=theme-color]").content=t.bg}
function modal(title,fields,ok){const d=$("#dlg");d.innerHTML=`<h2>${title}</h2>`+fields.map(f=>`<label>${f.l}</label>`+(f.t==="select"?`<select id="f_${f.k}">${f.o.map(o=>`<option ${o==f.v?"selected":""}>${o}</option>`).join("")}</select>`:f.t==="area"?`<textarea id="f_${f.k}" rows="3">${esc(f.v)}</textarea>`:`<input id="f_${f.k}" type="${f.t||"text"}" value="${esc(f.v??"")}" ${f.p?`placeholder="${f.p}"`:""} ${f.list?`list="dl"`:""}>`)).join("")+`<datalist id="dl">${[...new Set(S.tasks.map(t=>t.subject).concat(S.folders.map(f=>f.name)).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join("")}</datalist><div class="row" style="margin-top:14px"><button id="okb">💾 حفظ</button><button class="g" id="cb">إلغاء</button></div>`;
$("#cb").onclick=()=>d.close();$("#okb").onclick=()=>{const v={};fields.forEach(f=>v[f.k]=$("#f_"+f.k).value);if(ok(v)!==false)d.close()};d.showModal()}
const ask=m=>confirm(m);
let page="home",cur=null,trash=null,tk=null,pm={mode:"study",left:1500,run:false,t0:0,iv:null};
const PAGES=[["home","🏠","الرئيسية"],["tasks","📋","المهام"],["folders","📚","المكتبة"],["counters","🔢","العدادات"],["timer","⏲","المؤقت"],["stats","📊","الإحصائيات"],["quotes","💬","العبارات"],["settings","⚙️","الإعدادات"]];
function go(p){page=p;render()}
function render(){theme();$("#nav").innerHTML=PAGES.map(p=>`<button class="${p[0]==page?"on":""}" onclick="go('${p[0]}')">${p[1]}<br>${p[2]}</button>`).join("");$("#app").innerHTML=R[page]();if(R[page+"_"])R[page+"_"]()}
const pct=t=>t.qty?Math.min(100,Math.round(t.done*100/t.qty)):0,secsDay=d=>S.sess.filter(s=>s.k=="study"&&s.day==d).reduce((a,s)=>a+s.sec,0);
const R={
home(){const t=S.tasks.filter(x=>x.day==today()),dn=t.filter(x=>x.status=="مكتملة").length,q=Q[Math.floor(Date.now()/864e5*7)%Q.length][1].replace(" ❖ ","<br>");
return `<div class="hero"><div style="font-size:3em;color:var(--btn)">م</div><h1 style="font-size:1.8em">مرحبًا بك في مِرقَام</h1><div class="line"></div><h3>${TAG}</h3><hr style="border-color:var(--sub)"><h2 id="wd"></h2><h3 id="dt"></h3><div class="gold" id="clk"></div>${S.name?`<div class="muted">👤 ${esc(S.name)}</div>`:""}</div>
<div class="card" style="text-align:center"><h3>❝ ${q} ❞</h3></div>
<div class="grid"><div class="card"><h3>📋 مهام اليوم</h3>${t.slice(0,4).map(x=>`${x.status=="مكتملة"?"✅":"⬜"} ${esc(x.lesson||x.subject)}<br>`).join("")||"لا توجد مهام اليوم."}</div><div class="card"><h3>🎯 الإنجاز</h3>${dn} من ${t.length}<div class="bar"><i style="width:${t.length?dn*100/t.length:0}%"></i></div></div><div class="card"><h3>⏱ دراسة اليوم</h3><div class="big">${hms(secsDay(today()))}</div></div><div class="card"><h3>📚 المجلدات</h3><div class="big">${S.folders.length}</div></div></div>
<div class="grid">${[["tasks","➕ مهمة جديدة"],["folders","📚 المكتبة"],["counters","🔢 العدادات"],["timer","⏲ المؤقت"],["stats","📊 الإحصائيات"]].map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join("")}</div>`},
home_(){const u=()=>{const n=new Date(),w=$("#wd");if(!w)return;w.textContent=DAYS[n.getDay()];$("#dt").textContent=`${n.getDate()} ${MON[n.getMonth()]} ${n.getFullYear()} م`;$("#clk").textContent=n.toTimeString().slice(0,8)};u();clearInterval(tk);tk=setInterval(u,1000)},
tasks(){const f=cur||"all",s=(window._ts||"").trim();let L=S.tasks.filter(t=>(f=="all"||(f=="today"?t.day==today():t.status==f))&&(!s||(t.subject+t.lesson).includes(s))).sort((a,b)=>(a.day+a.st).localeCompare(b.day+b.st));
return `<h1>📋 المهام الدراسية</h1><div class="row"><select onchange="cur=this.value;render()"><option value="all">كل المهام</option><option value="today" ${f=="today"?"selected":""}>اليوم</option>${ST.map(x=>`<option ${f==x?"selected":""}>${x}</option>`).join("")}</select><input placeholder="🔍 بحث" value="${esc(s)}" oninput="window._ts=this.value;render()"><button onclick="editTask()">➕ مهمة جديدة</button></div>${trash?`<button class="g" onclick="undo()">↩ تراجع عن الحذف</button>`:""}
${L.map(t=>`<div class="card"><h3>📚 ${esc(t.subject||"—")}</h3><div>📝 ${esc(t.lesson)}</div><div class="muted">📅 ${dstr(t.day)} — ⏰ من ${t.st} إلى ${t.en}</div><div>${PR[t.pr]} ${t.pr} • ${t.status} • ⏱ ${hms(t.sec||0)}</div><div class="bar"><i style="width:${pct(t)}%"></i></div><small>${t.done} / ${t.qty} (${pct(t)}%)</small>${t.notes?`<div class="muted">🗒 ${esc(t.notes)}</div>`:""}<div class="row" style="margin-top:8px"><button onclick="timerTask(${t.id})">${S.active&&S.active.id==t.id?"⏹ أوقف":"▶ ابدأ"}</button><button class="g" onclick="editTask(${t.id})">✏️</button><button class="g" onclick="doneTask(${t.id})">✅</button><button class="g" onclick="delTask(${t.id})">🗑</button></div></div>`).join("")||`<div class="card">لا توجد مهام بعد. اضغط «➕ مهمة جديدة».</div>`}`},
folders(){const kids=S.folders.filter(f=>(f.p||0)==(cur||0)),f=S.folders.find(x=>x.id==cur);
return `<h1>📚 المكتبة الدراسية</h1><div class="row"><b>${f?"📂 "+esc(f.name):"المجلدات الرئيسية"}</b>${f?`<button class="g" onclick="cur=f_up(${f.id});render()">⬅ رجوع</button>`:""}<button onclick="editFolder()">➕ مجلد</button></div>
${kids.map(k=>`<div class="card" style="border-color:${k.c}"><h3 onclick="cur=${k.id};render()" style="cursor:pointer">${k.i} ${esc(k.name)}</h3><div class="row"><button class="g" onclick="editFolder(${k.id})">✏️</button><button class="g" onclick="delFolder(${k.id})">🗑</button></div></div>`).join("")||`<div class="card">لا توجد مجلدات هنا.</div>`}
${f?`<h2>الدروس والملاحظات</h2><button onclick="editLesson()">➕ درس</button>`+S.lessons.filter(l=>l.f==cur).map(l=>`<div class="card"><h3>${l.d?"✅":"📄"} ${esc(l.t)}</h3><div style="white-space:pre-wrap">${esc(l.n)}</div><div class="row"><button class="g" onclick="editLesson(${l.id})">✏️</button><button class="g" onclick="S.lessons.find(x=>x.id==${l.id}).d^=1;save();render()">✔</button><button class="g" onclick="if(ask('حذف الدرس؟')){S.lessons=S.lessons.filter(x=>x.id!=${l.id});save();render()}">🗑</button></div></div>`).join(""):""}`},
counters(){const t=today();return `<h1>🔢 العدادات الدراسية</h1><button onclick="addCounter()">➕ عداد جديد</button><div class="grid">${S.counters.map(c=>`<div class="card"><h3>${esc(c.name)}</h3><div class="big">${c.v}</div><div class="muted">${esc(c.unit)} — اليوم: ${S.clog.filter(l=>l.c==c.id&&l.day==t).reduce((a,l)=>a+l.d,0)}</div><div class="row"><button onclick="bump(${c.id},-1)">➖</button><button onclick="bump(${c.id},1)">➕</button><button onclick="bump(${c.id},5)">+5</button></div><div class="row" style="margin-top:6px"><button class="g" onclick="bump(${c.id},-${c.v})">↺</button><button class="g" onclick="if(ask('حذف العداد؟')){S.counters=S.counters.filter(x=>x.id!=${c.id});save();render()}">🗑</button></div></div>`).join("")}</div>`},
timer(){const open=S.tasks.filter(t=>t.status!="مكتملة");return `<h1>⏲ مؤقت الدراسة</h1><div class="card" style="text-align:center"><h2 id="pml">${pm.mode=="study"?"وضع الدراسة 📖":"وقت الاستراحة ☕"}</h2><div class="big" id="pmt" style="font-size:4em">${String(Math.floor(pm.left/60)).padStart(2,"0")}:${String(pm.left%60).padStart(2,"0")}</div><div class="row"><div><label>دراسة (دقيقة)</label><input id="sm" type="number" value="${window._sm||25}" min="1"></div><div><label>استراحة (دقيقة)</label><input id="bm" type="number" value="${window._bm||5}" min="1"></div></div><label>ربط بمهمة</label><select id="pt"><option value="">— بدون —</option>${open.map(t=>`<option value="${t.id}">${esc(t.subject+" — "+t.lesson)}</option>`).join("")}</select><div class="row" style="margin-top:10px"><button onclick="pmToggle()">${pm.run?"⏸ إيقاف":"▶ ابدأ"}</button><button class="g" onclick="pmReset()">↺ إعادة</button><button class="g" onclick="pmSwitch()">⏭ تبديل</button></div></div><h3>آخر الجلسات</h3>${S.sess.slice(-8).reverse().map(s=>`<div class="card">${s.day} — ${s.k=="study"?"دراسة":"استراحة"} ${hms(s.sec)}</div>`).join("")||"لا توجد جلسات."}`},
stats(){const ds=[...Array(7)].map((_,i)=>new Date(Date.now()-(6-i)*864e5).toLocaleDateString("en-CA")),m=ds.map(d=>secsDay(d)/60),c=ds.map(d=>S.tasks.filter(t=>t.status=="مكتملة"&&t.day==d).length),ch=(a,t)=>{const mx=Math.max(...a,t=="m"?5:3);return `<div class="charts">${a.map((v,i)=>`<div><small>${v?(v<10?v.toFixed(1):Math.round(v)):""}</small><i style="height:${v*100/mx}px"></i>${ds[i].slice(8)}/${ds[i].slice(5,7)}</div>`).join("")}</div>`},tot=S.tasks.reduce((a,t)=>a+t.qty,0),dn=S.tasks.reduce((a,t)=>a+Math.min(t.done,t.qty),0);
return `<h1>📊 الإحصائيات</h1><div class="card"><div>✅ مهام مكتملة: اليوم ${c[6]} | الأسبوع ${c.reduce((a,b)=>a+b,0)}</div><div>⏱ إجمالي الدراسة: ${hms(S.sess.filter(s=>s.k=="study").reduce((a,s)=>a+s.sec,0))}</div><div>🎯 الالتزام بالأهداف: ${tot?Math.round(dn*100/tot):0}%</div>${S.counters.map(x=>`<div>• ${esc(x.name)} ${x.v}</div>`).join("")}</div><div class="card"><h3>⏱ دقائق الدراسة — آخر ٧ أيام</h3>${ch(m,"m")}</div><div class="card"><h3>✅ المهام المكتملة — آخر ٧ أيام</h3>${ch(c,"c")}</div>`},
quotes(){const c=window._qc||"الكل",s=window._qs||"",cats=["الكل","⭐ المفضلة",...new Set(Q.map(x=>x[0]))];
return `<h1>💬 مكتبة العبارات</h1><div class="row"><select onchange="window._qc=this.value;render()">${cats.map(x=>`<option ${x==c?"selected":""}>${x}</option>`).join("")}</select><input placeholder="🔍 بحث" value="${esc(s)}" onchange="window._qs=this.value;render()"><button onclick="go('quotes')">🎲</button></div>`+Q.filter(x=>(c=="الكل"||(c=="⭐ المفضلة"?S.favs.includes(x[1]):x[0]==c))&&(!s||x[1].includes(s))).sort(()=>Math.random()-.5).map(x=>`<div class="card">${x[1].replace(" ❖ ","<br>")}<div class="row" style="margin-top:8px"><button class="g" onclick="fav(this.dataset.q)" data-q="${esc(x[1])}">${S.favs.includes(x[1])?"⭐ إزالة":"☆ مفضلة"}</button><button class="g" onclick="navigator.clipboard.writeText(this.dataset.q.replace(' ❖ ','\\n'));alert('تم النسخ')" data-q="${esc(x[1])}">📋 نسخ</button></div></div>`).join("")},
settings(){return `<h1>⚙️ الإعدادات</h1><div class="card"><h3>👤 الملف الشخصي (محلي)</h3><label>الاسم</label><input value="${esc(S.name)}" onchange="S.name=this.value;save()"><h3>🔐 حساب Google</h3>${S.user?`<div class="row"><img src="${esc(S.user.picture)}" width="48" height="48" style="border-radius:50%;flex:0 0 48px"><div>${esc(S.user.name)}<br><small>${esc(S.user.email)}</small></div></div><button class="g" onclick="gOut()">🚪 تسجيل الخروج</button>`:`<div id="gbtn">${S.cid?"":"<small class='muted'>ضع Client ID بالأسفل لتظهر أيقونة تسجيل الدخول.</small>"}</div><label>Google Client ID (من Google Cloud)</label><input value="${esc(S.cid||"")}" placeholder="xxxx.apps.googleusercontent.com" onchange="S.cid=this.value.trim();save();render()">`}</div>
<div class="card"><h3>🎨 المظهر والتخصيص</h3><select onchange="S.theme=this.value;if(S.theme=='مخصص'&&!S.custom)S.custom={...TH['برغندي']};save();render()">${[...Object.keys(TH),"مخصص"].map(x=>`<option ${S.theme==x?"selected":""}>${x}</option>`).join("")}</select><div class="row"><button class="g" onclick="S.theme='ليلي';save();render()">🌙 ليلي</button><button class="g" onclick="S.theme='نهاري';save();render()">☀️ نهاري</button></div>${Object.keys(CL).map(k=>{const v=(S.theme=="مخصص"?S.custom:TH[S.theme])[k];return `<label>${CL[k]}</label><div class="row"><input type="color" value="${v}" onchange="setC('${k}',this.value)"><input value="${v}" onchange="setC('${k}',this.value)"></div>`}).join("")}<label>حجم الخط: ${S.fs}</label><input type="range" min="14" max="26" value="${S.fs}" onchange="S.fs=+this.value;save();render()"></div>
<div class="card"><h3>💾 النسخ الاحتياطي</h3><div class="row"><button onclick="exp()">تصدير نسخة</button><button class="g" onclick="$('#imp').click()">استعادة نسخة</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])"><p class="muted">🔄 تُحفظ نسخة تلقائية محلية عند كل تغيير (آخر 3 نسخ). النسخ غير مشفّرة. الإصدار 1.1.</p><button class="g" onclick="restoreAuto()">↩ استعادة نسخة تلقائية</button></div>`}};
function gLoad(cb){if(window.google&&google.accounts)return cb();const e=document.createElement("script");e.src="https://accounts.google.com/gsi/client";e.onload=cb;e.onerror=()=>alert("تعذر تحميل خدمة Google (تحتاج إنترنت)");document.head.appendChild(e)}
R.settings_=()=>{if(S.user||!S.cid||!$("#gbtn"))return;gLoad(()=>{google.accounts.id.initialize({client_id:S.cid,callback:r=>{try{const p=JSON.parse(decodeURIComponent(escape(atob(r.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))));S.user={name:p.name||"",email:p.email||"",picture:p.picture||""};if(!S.name)S.name=p.given_name||p.name||"";save();render()}catch(e){alert("تعذر قراءة بيانات الحساب")}}});google.accounts.id.renderButton($("#gbtn"),{theme:"outline",size:"large",locale:"ar"})})};
function gOut(){try{google.accounts.id.disableAutoSelect()}catch(e){}S.user=null;save();render()}
function restoreAuto(){const b=JSON.parse(localStorage.getItem(KEY+"_bk")||"[]");if(!b.length)return alert("لا توجد نسخ تلقائية بعد");modal("استعادة نسخة تلقائية",[{k:"i",l:"اختر النسخة",t:"select",o:b.map((x,i)=>new Date(x.t).toLocaleString("ar-EG-u-nu-latn")+" #"+(i+1)),v:""}],v=>{if(!ask("سيتم استبدال بياناتك الحالية. متابعة؟"))return false;S=Object.assign(DEF(),JSON.parse(b[+v.i.split("#")[1]-1].d));save();render()})}
function setC(k,v){if(!/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(v)){alert("رمز اللون غير صالح");return render()}S.custom=Object.assign({},TH[S.theme]||S.custom||TH["برغندي"],S.custom||{});S.custom[k]=v;S.theme="مخصص";save();render()}
function fav(q){const i=S.favs.indexOf(q);i<0?S.favs.push(q):S.favs.splice(i,1);save();render()}
function bump(i,d){const c=S.counters.find(x=>x.id==i);d=Math.max(d,-c.v);if(!d)return;if(d<-1&&!ask("تصفير العداد؟"))return;c.v+=d;S.clog.push({c:i,d,day:today()});save();render()}
function addCounter(){modal("عداد جديد",[{k:"n",l:"الاسم",p:"مثال: كم مسألة حللت؟"},{k:"u",l:"الوحدة"}],v=>{if(!v.n.trim())return false;S.counters.push({id:id(),name:v.n.trim(),unit:v.u,v:0});save();render()})}
function editTask(i){const t=S.tasks.find(x=>x.id==i)||{subject:"",lesson:"",qty:1,done:0,day:today(),st:"16:00",en:"17:00",pr:"متوسطة",status:ST[0],notes:""};
modal("📘 ما الذي تريد دراسته؟",[{k:"subject",l:"📚 المادة",v:t.subject,list:1,p:"مثال: الرياضيات"},{k:"lesson",l:"📝 الدرس / الفقرة",v:t.lesson},{k:"qty",l:"🔢 المطلوب",t:"number",v:t.qty},{k:"done",l:"المنجز",t:"number",v:t.done},{k:"day",l:"📅 التاريخ",t:"date",v:t.day},{k:"st",l:"من",t:"time",v:t.st},{k:"en",l:"إلى",t:"time",v:t.en},{k:"pr",l:"⭐ الأولوية",t:"select",o:Object.keys(PR),v:t.pr},{k:"status",l:"📌 الحالة",t:"select",o:ST,v:t.status},{k:"notes",l:"🗒 ملاحظات",t:"area",v:t.notes}],v=>{
if(!v.subject.trim()&&!v.lesson.trim()){alert("اكتب المادة أو عنوان الدرس");return false}if(v.en<v.st){alert("وقت الانتهاء قبل البدء");return false}
const o={subject:v.subject.trim(),lesson:v.lesson.trim(),qty:Math.max(1,+v.qty||1),done:Math.max(0,+v.done||0),day:v.day||today(),st:v.st,en:v.en,pr:v.pr,status:v.status,notes:v.notes};
i?Object.assign(t,o):S.tasks.push(Object.assign({id:id(),sec:0},o));save();render()})}
function doneTask(i){const t=S.tasks.find(x=>x.id==i);t.status="مكتملة";t.done=t.qty;save();render()}
function delTask(i){if(!ask("حذف المهمة؟ (يمكنك التراجع)"))return;trash=S.tasks.find(x=>x.id==i);S.tasks=S.tasks.filter(x=>x.id!=i);save();render()}
function undo(){if(trash){S.tasks.push(trash);trash=null;save();render()}}
function timerTask(i){const a=S.active;if(a){const sec=(Date.now()-a.t0)/1000,t=S.tasks.find(x=>x.id==a.id);if(t)t.sec=(t.sec||0)+sec;S.sess.push({k:"study",sec,day:today(),t:a.id});S.active=null;save();if(a.id!=i)return timerTask(i);return render()}
const t=S.tasks.find(x=>x.id==i);if(t.status==ST[0])t.status=ST[1];S.active={id:i,t0:Date.now()};save();render()}
function editFolder(i){const f=S.folders.find(x=>x.id==i)||{name:"",i:"📁",c:"#c9a24a"};modal("مجلد",[{k:"name",l:"الاسم",v:f.name},{k:"i",l:"الأيقونة",t:"select",o:["📁","📘","📗","📕","📙","🧪","📐","🌍","✍️","💻","🎨","⚖️","🩺","🕌"],v:f.i},{k:"c",l:"اللون",t:"color",v:f.c}],v=>{if(!v.name.trim())return false;i?Object.assign(f,{name:v.name.trim(),i:v.i,c:v.c}):S.folders.push({id:id(),p:cur||0,name:v.name.trim(),i:v.i,c:v.c});save();render()})}
const f_up=i=>(S.folders.find(x=>x.id==i)||{}).p||null;
function delFolder(i){if(!ask("سيتم حذف المجلد وكل ما بداخله. متأكد؟"))return;const rm=n=>{S.folders.filter(x=>x.p==n).forEach(x=>rm(x.id));S.lessons=S.lessons.filter(l=>l.f!=n);S.folders=S.folders.filter(x=>x.id!=n)};rm(i);save();render()}
function editLesson(i){const l=S.lessons.find(x=>x.id==i)||{t:"",n:""};modal("درس / ملاحظة",[{k:"t",l:"العنوان",v:l.t},{k:"n",l:"الملاحظات",t:"area",v:l.n}],v=>{if(!v.t.trim())return false;i?Object.assign(l,{t:v.t.trim(),n:v.n}):S.lessons.push({id:id(),f:cur,t:v.t.trim(),n:v.n,d:0});save();render()})}
function pmTotal(){return(pm.mode=="study"?+($("#sm")?.value||window._sm||25):+($("#bm")?.value||window._bm||5))*60}
function pmLog(){if(pm.run){pm.run=false;clearInterval(pm.iv);const sec=Math.round((Date.now()-pm.t0)/1000);if(sec>0){S.sess.push({k:pm.mode,sec,day:today(),t:$("#pt")?.value||null});const t=S.tasks.find(x=>x.id==+$("#pt")?.value);if(t&&pm.mode=="study")t.sec=(t.sec||0)+sec;save()}}}
function pmToggle(){if(pm.run){pmLog();return render()}window._sm=$("#sm").value;window._bm=$("#bm").value;if(pm.left<=0)pm.left=pmTotal();pm.run=true;const start=pm.left;pm.t0=Date.now();pm.iv=setInterval(()=>{pm.left=start-Math.round((Date.now()-pm.t0)/1000);const e=$("#pmt");if(e)e.textContent=String(Math.floor(Math.max(pm.left,0)/60)).padStart(2,"0")+":"+String(Math.max(pm.left,0)%60).padStart(2,"0");if(pm.left<=0){pmLog();navigator.vibrate&&navigator.vibrate(300);alert("انتهى الوقت! 🎉");pmSwitch()}},500);render()}
function pmReset(){pmLog();window._sm=$("#sm")?.value||25;window._bm=$("#bm")?.value||5;pm.left=pmTotal();render()}
function pmSwitch(){pmLog();pm.mode=pm.mode=="study"?"break":"study";pm.left=pmTotal();render()}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="mirqaam_backup_"+today()+".json";a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks))throw 0;if(ask("سيتم استبدال بياناتك الحالية. متابعة؟")){S=Object.assign(DEF(),d);save();render()}}catch(e){alert("الملف ليس نسخة صالحة من مِرقَام")}};r.readAsText(f)}
render();setTimeout(()=>$("#sp").classList.add("hide"),2800);
if(!S.name)setTimeout(()=>modal("أهلاً بك في مِرقَام",[{k:"n",l:"ما اسمك؟"}],v=>{S.name=v.n.trim();save();render()}),3600);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
