<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<style>
:root{--bg:#2a0f17;--card:#3d1623;--btn:#c9a24a;--text:#f5ecd9;--icon:#c9a24a;--sub:#8c3a4e;--fs:17px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.6 var(--ff,"Segoe UI"),"Segoe UI",Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:.3em 0;color:var(--icon)}.muted{color:var(--sub)}main{max-width:900px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--sub);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 6px 18px #0006}
.hero{background:linear-gradient(135deg,var(--sub),var(--card) 55%,var(--bg));border:1px solid var(--btn);border-radius:24px;padding:20px;text-align:center}
.hero .gold{color:var(--btn);font-weight:bold;font-size:1.5em}.line{height:2px;background:var(--btn);margin:8px auto;width:60%}
button,.b{background:var(--btn);color:var(--bg);border:0;border-radius:12px;padding:9px 14px;font:inherit;font-weight:bold;cursor:pointer}
button.g{background:none;color:var(--text);border:1px solid var(--sub)}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--sub);border-radius:10px;padding:8px;font:inherit}
label{display:block;margin:8px 0 2px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bar{height:14px;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--sub)}.bar i{display:block;height:100%;background:var(--btn)}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--sub);display:flex;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;color:var(--text);flex:0 0 auto;min-width:74px;font-size:.8em;padding:6px}nav button.on{background:var(--btn);color:var(--bg)}
dialog{background:var(--card);color:var(--text);border:1px solid var(--btn);border-radius:18px;width:min(92vw,480px)}dialog::backdrop{background:#000a}
.big{font-size:2em;font-weight:bold;color:var(--btn);text-align:center}.charts{display:flex;align-items:flex-end;gap:6px;height:130px}
.charts div{flex:1;text-align:center;font-size:.7em}.charts i{display:block;background:var(--btn);border-radius:6px 6px 0 0;min-height:2px}
#sp{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;transition:opacity 1.2s}
#fc{z-index:8}.gt{border-collapse:collapse;width:100%}.gt td,.gt th{border:2px solid var(--btn);padding:0}.gt input{border:0;border-radius:0;min-width:90px;background:transparent}.gt th{background:var(--sub)}.tw{overflow:auto;border-radius:12px}#toast{position:fixed;top:10px;inset-inline:10px;z-index:20;background:var(--btn);color:var(--bg);padding:12px;border-radius:12px;font-weight:bold;text-align:center}#app>*{animation:fi .35s both}@keyframes fi{from{opacity:0;transform:translateY(8px)}}@media print{nav,button,#sp,#dlg{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none}}#fc{position:fixed;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}#sp b{font-size:3.4em;color:var(--btn)}.hide{opacity:0;pointer-events:none}
body{padding-bottom:30px}main{padding-top:60px}
nav{inset:0 0 0 auto;left:auto;right:0;bottom:0;top:0;width:min(78vw,300px);flex-direction:column;overflow-x:hidden;overflow-y:auto;border-top:0;border-inline-start:1px solid var(--sub);padding:calc(16px + env(safe-area-inset-top)) 10px 16px;transform:translateX(105%);transition:transform .25s;z-index:7;box-shadow:-6px 0 20px #0008}
nav button{display:block;width:100%;text-align:start;font-size:1.05em;padding:13px 14px;border-radius:12px;margin-bottom:4px;min-width:0}
.mo nav{transform:none}
#mb{position:fixed;top:calc(8px + env(safe-area-inset-top));right:12px;z-index:6;width:46px;height:46px;border-radius:14px;font-size:1.4em;padding:0;box-shadow:0 4px 14px #0007}
#ov{position:fixed;inset:0;background:#0008;z-index:6;display:none}.mo #ov{display:block}.lk #mb{display:none}
</style></head><body>
<div id="sp"><div style="font-size:6em;color:var(--btn)">م</div><b>مِرقَام</b><div style="letter-spacing:6px">MIRQAAM</div><p>مِرقَام… لأن لكل إنجاز بداية، ولكل هدف طريق.</p></div>
<main id="app"></main><nav id="nav"></nav><dialog id="dlg"></dialog>

const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],MON=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEF=()=>({name:"",theme:"برغندي",custom:null,fs:17,tasks:[],folders:[],lessons:[],sess:[],favs:[],clog:[],nid:1,active:null,
counters:["كم تمريناً حللت؟|تمرين","كم فقرة حفظت؟|فقرة","كم درساً أنجزت؟|درس","كم صفحة درست؟|صفحة","كم ساعة درست؟|ساعة"].map((x,i)=>({id:i+1,name:x.split("|")[0],unit:x.split("|")[1],v:0}))});
let S;try{S=Object.assign(DEF(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=DEF()}
let bt;const snap=()=>{try{const b=JSON.parse(localStorage.getItem(KEY+"_bk")||"[]");b.push({t:Date.now(),d:JSON.stringify(S)});while(b.length>3)b.shift();localStorage.setItem(KEY+"_bk",JSON.stringify(b))}catch(e){}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("تعذر الحفظ على هذا الجهاز")}clearTimeout(bt);bt=setTimeout(snap,5000)};
const id=()=>S.nid++,today=()=>new Date().toLocaleDateString("en-CA"),
dstr=s=>{const d=new Date(s+"T12:00:00");return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()} م`},
hms=s=>{s=Math.floor(s);return [s/3600,s%3600/60,s%60].map(x=>String(Math.floor(x)).padStart(2,"0")).join(":")};
function theme(){const t=Object.assign({},TH["برغندي"],S.theme==="مخصص"?S.custom:TH[S.theme]);for(const k in t)document.documentElement.style.setProperty("--"+k,t[k]);document.documentElement.style.setProperty("--fs",S.fs+"px");document.querySelector("meta[name=theme-color]").content=t.bg}
function modal(title,fields,ok){const d=$("#dlg");d.innerHTML=`<h2>${title}</h2>`+fields.map(f=>`<label>${f.l}</label>`+(f.t==="select"?`<select id="f_${f.k}">${f.o.map(o=>`<option ${o==f.v?"selected":""}>${o}</option>`).join("")}</select>`:f.t==="area"?`<textarea id="f_${f.k}" rows="3">${esc(f.v)}</textarea>`:`<input id="f_${f.k}" type="${f.t||"text"}" value="${esc(f.v??"")}" ${f.p?`placeholder="${f.p}"`:""} ${f.list?`list="dl"`:""}>`)).join("")+`<datalist id="dl">${[...new Set(S.tasks.map(t=>t.subject).concat(S.folders.map(f=>f.name)).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join("")}</datalist><div class="row" style="margin-top:14px"><button id="okb">💾 حفظ</button><button class="g" id="cb">إلغاء</button></div>`;
$("#cb").onclick=()=>d.close();$("#okb").onclick=()=>{const v={};fields.forEach(f=>v[f.k]=$("#f_"+f.k).value);if(ok(v)!==false)d.close()};if(!d.open)d.showModal()}
const ask=m=>confirm(m);
let page="home",cur=null,trash=null,tk=null,pm={mode:"study",left:1500,run:false,t0:0,iv:null};
const PAGES=[["home","🏠","الرئيسية"],["search","🔎","بحث"],["tasks","📋","المهام"],["cal","📅","التقويم"],["week","🏫","الجدول الأسبوعي"],["grades","🎓","العلامات والمعدل"],["folders","📚","المكتبة"],["files","📎","المرفقات"],["counters","🔢","العدادات"],["timer","⏲","المؤقت"],["stats","📊","الإحصائيات"],["cards","🃏","البطاقات"],["exams","🎯","الامتحانات"],["tables","🗂","الجداول"],["dhikr","🕌","الصلاة والأذكار"],["goals","🏆","أهدافي"],["quotes","💬","العبارات"],["settings","⚙️","الإعدادات"]];
function go(p){if(p!=page)cur=null;page=p;render()}
function render(){theme();if(locked)return lockScreen();$("#nav").innerHTML=PAGES.map(p=>`<button class="${p[0]==page?"on":""}" onclick="go('${p[0]}')">${p[1]}&nbsp;&nbsp;${p[2]}</button>`).join("");$("#app").innerHTML=R[page]();if(R[page+"_"])R[page+"_"]()}
const pct=t=>t.qty?Math.min(100,Math.round(t.done*100/t.qty)):0,secsDay=d=>S.sess.filter(s=>s.k=="study"&&s.day==d).reduce((a,s)=>a+s.sec,0);
const R={
home(){const t=S.tasks.filter(x=>x.day==today()),dn=t.filter(x=>x.status=="مكتملة").length,q=Q[Math.floor(Date.now()/864e5*7)%Q.length][1].replace(" ❖ ","<br>");
return `<div class="hero"><div style="font-size:3em;color:var(--btn)">م</div><h1 style="font-size:1.8em">مرحبًا بك في مِرقَام</h1><div class="line"></div><h3>${TAG}</h3><hr style="border-color:var(--sub)"><h2 id="wd"></h2><h3 id="dt"></h3><div class="gold" id="clk"></div>${S.name?`<div class="muted">👤 ${esc(S.name)}</div>`:""}</div>
<div class="card" style="text-align:center"><h3>❝ ${q} ❞</h3></div>
<div class="grid"><div class="card"><h3>📋 مهام اليوم</h3>${t.slice(0,4).map(x=>`${x.status=="مكتملة"?"✅":"⬜"} ${esc(x.lesson||x.subject)}<br>`).join("")||"لا توجد مهام اليوم."}</div><div class="card"><h3>🎯 الإنجاز</h3>${dn} من ${t.length}<div class="bar"><i style="width:${t.length?dn*100/t.length:0}%"></i></div></div><div class="card"><h3>⏱ دراسة اليوم</h3><div class="big">${hms(secsDay(today()))}</div></div><div class="card"><h3>📚 المجلدات</h3><div class="big">${S.folders.length}</div></div></div>
<div class="grid">${[["tasks","➕ مهمة جديدة"],["folders","📚 المكتبة"],["counters","🔢 العدادات"],["timer","⏲ المؤقت"],["stats","📊 الإحصائيات"]].map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join("")}</div>`},
home_(){const u=()=>{const n=new Date(),w=$("#wd");if(!w)return;w.textContent=DAYS[n.getDay()];$("#dt").textContent=`${n.getDate()} ${MON[n.getMonth()]} ${n.getFullYear()} م`;$("#clk").textContent=n.toTimeString().slice(0,8)};u();clearInterval(tk);tk=setInterval(u,1000)},
tasks(){const f=cur||"all",s=(window._ts||"").trim();let L=S.tasks.filter(t=>(f=="all"||(f=="today"?t.day==today():t.status==f))&&(!s||(t.subject+t.lesson).includes(s))).sort((a,b)=>(a.day+a.st).localeCompare(b.day+b.st));
return `<h1>📋 المهام الدراسية</h1><div class="row"><select onchange="cur=this.value;render()"><option value="all">كل المهام</option><option value="today" ${f=="today"?"selected":""}>اليوم</option>${ST.map(x=>`<option ${f==x?"selected":""}>${x}</option>`).join("")}</select><input placeholder="🔍 بحث" value="${esc(s)}" oninput="window._ts=this.value;render()"><button onclick="editTask()">➕ مهمة جديدة</button></div>${trash?`<button class="g" onclick="undo()">↩ تراجع عن الحذف</button>`:""}
${L.map(t=>`<div class="card"><h3>📚 ${esc(t.subject||"—")}</h3><div>📝 ${esc(t.lesson)}</div><div class="muted">📅 ${dstr(t.day)} — ⏰ من ${t.st} إلى ${t.en}</div><div>${PR[t.pr]} ${t.pr} • ${t.status} • ⏱ ${hms(t.sec||0)}</div><div class="bar"><i style="width:${pct(t)}%"></i></div><small>${t.done} / ${t.qty} (${pct(t)}%)</small>${t.notes?`<div class="muted">🗒 ${esc(t.notes)}</div>`:""}<div class="row" style="margin-top:8px"><button onclick="timerTask(${t.id})">${S.active&&S.active.id==t.id?"⏹ أوقف":"▶ ابدأ"}</button><button class="g" onclick="editTask(${t.id})">✏️</button><button class="g" onclick="doneTask(${t.id})">✅</button><button class="g" onclick="delTask(${t.id})">🗑</button></div></div>`).join("")||`<div class="card">لا توجد مهام بعد. اضغط «➕ مهمة جديدة».</div>`}`},
folders(){const kids=S.folders.filter(f=>(f.p||0)==(cur||0)),f=S.folders.find(x=>x.id==cur);
return `<h1>📚 المكتبة الدراسية</h1><div class="row"><b>${f?"📂 "+esc(f.name):"المجلدات الرئيسية"}</b>${f?`<button class="g" onclick="cur=f_up(${f.id});render()">⬅ رجوع</button>`:""}<button onclick="editFolder()">➕ مجلد</button></div>
${kids.map(k=>`<div class="card" style="border-color:${k.c}"><h3 onclick="cur=${k.id};render()" style="cursor:pointer">${k.i} ${esc(k.name)}</h3><div class="row"><button class="g" onclick="editFolder(${k.id})">✏️</button><button class="g" onclick="delFolder(${k.id})">🗑</button></div></div>`).join("")||`<div class="card">لا توجد مجلدات هنا.</div>`}
${f?`<h2>الدروس والملاحظات</h2><button onclick="editLesson()">➕ درس</button>`+S.lessons.filter(l=>l.f==cur).map(l=>`<div class="card"><h3>${l.d?"✅":"📄"} ${esc(l.t)}</h3><div style="white-space:pre-wrap">${esc(l.n)}</div><div class="row"><button class="g" onclick="editLesson(${l.id})">✏️</button><button class="g" onclick="S.lessons.find(x=>x.id==${l.id}).d^=1;save();render()">✔</button><button class="g" onclick="if(ask('حذف الدرس؟')){S.lessons=S.lessons.filter(x=>x.id!=${l.id});save();render()}">🗑</button></div></div>`).join(""):""}`},

const _s5=R.settings;R.settings=()=>_s5()+`<div class="card"><h3>🔔 الإشعارات</h3><p>الحالة: <b>${window.Notification?({granted:"مفعّلة ✅",denied:"محظورة ❌ (فعّلها من إعدادات المتصفح)",default:"غير مفعّلة"}[Notification.permission]):"غير مدعومة"}</b></p><div class="row"><button onclick="enableNotif()">🔔 تفعيل الإشعارات</button><button class="g" onclick="notify(PH['العصر'],'🕌 تجربة: حان وقت صلاة العصر')">تجربة إشعار فخم</button></div><label style="margin-top:8px"><input type="checkbox" style="width:auto" ${S.rem.tasks?"checked":""} onchange="S.rem.tasks=this.checked?1:0;save();syncSched()"> تذكير المهام عند وقت بدئها</label><p class="muted">الإشعارات تصل والتطبيق مفتوح أو في الخلفية. وعندما يكون مغلقاً تماماً أحاول إيصالها عبر مزامنة الخلفية، لكن أندرويد لا يضمن ذلك. للحصول على أفضل نتيجة: ثبّت التطبيق على الشاشة الرئيسية، واترك له الاستثناء من «توفير الطاقة».</p></div>`;

// ===== الدفعة 5: القائمة الجانبية، الجدول الأسبوعي، العلامات والمعدل، هدف الساعات =====
document.body.insertAdjacentHTML("beforeend",'<button id="mb" onclick="toggleMenu()" aria-label="القائمة">☰</button><div id="ov" onclick="closeMenu()"></div>');
const toggleMenu=()=>document.body.classList.toggle("mo"),closeMenu=()=>document.body.classList.remove("mo");
const _go=go;go=function(p){closeMenu();_go(p)};
const _rd=render;render=function(){document.body.classList.toggle("lk",!!locked);_rd()};
S.tt=S.tt||[];S.gr=S.gr||[];S.wg=S.wg||0;
const WN=["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"],wdi=d=>(d.getDay()+1)%7;
R.week=()=>{const td=wdi(new Date());return `<h1>🏫 الجدول الأسبوعي</h1><button onclick="editCls()">➕ حصة جديدة</button>`+WN.map((n,i)=>{const L=S.tt.filter(x=>x.d==i).sort((a,b)=>a.f.localeCompare(b.f));return `<div class="card" style="${i==td?"border:2px solid var(--btn)":""}"><h3>${n}${i==td?" — اليوم":""}</h3>${L.map(x=>`<div class="row" style="flex-wrap:nowrap;margin:6px 0"><div style="flex:1">🕒 ${x.f}–${x.t} — <b>${esc(x.s)}</b>${x.r?` <span class="muted">(${esc(x.r)})</span>`:""}</div><button class="g" style="flex:0 0 auto" onclick="editCls(${x.id})">✏️</button><button class="g" style="flex:0 0 auto" onclick="delCls(${x.id})">🗑</button></div>`).join("")||"<div class='muted'>لا حصص.</div>"}</div>`}).join("")};
function editCls(i){const c=S.tt.find(x=>x.id==i)||{s:"",d:wdi(new Date()),f:"08:00",t:"09:00",r:""};modal("🏫 حصة",[{k:"s",l:"المادة",v:c.s,list:1},{k:"d",l:"اليوم",t:"select",o:WN,v:WN[c.d]},{k:"f",l:"من",t:"time",v:c.f},{k:"t",l:"إلى",t:"time",v:c.t},{k:"r",l:"القاعة / المدرّس (اختياري)",v:c.r}],v=>{if(!v.s.trim()){alert("اكتب اسم المادة");return false}if(v.t<=v.f){alert("وقت الانتهاء يجب أن يكون بعد البدء");return false}const o={s:v.s.trim(),d:WN.indexOf(v.d),f:v.f,t:v.t,r:v.r};if(i)Object.assign(c,o);else S.tt.push({id:id(),...o});save();render()})}
function delCls(i){if(ask("حذف الحصة؟")){S.tt=S.tt.filter(x=>x.id!=i);save();render()}}
const nextCls=()=>{const n=new Date(),hm=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),x=S.tt.filter(c=>c.d==wdi(n)&&c.f>hm).sort((a,b)=>a.f.localeCompare(b.f))[0];return x?`<div class="card" style="text-align:center">🏫 حصتك القادمة: <b>${esc(x.s)}</b> الساعة ${x.f}</div>`:""};
const gpa4=p=>p>=90?4:p>=85?3.7:p>=80?3.3:p>=75?3:p>=70?2.7:p>=65?2.3:p>=60?2:p>=55?1.7:p>=50?1:0;
R.grades=()=>{const subs=[...new Set(S.gr.map(g=>g.s))].map(s=>{const L=S.gr.filter(g=>g.s==s),w=L.reduce((a,g)=>a+(+g.w||1),0),p=L.reduce((a,g)=>a+(g.sc/g.mx*100)*(+g.w||1),0)/(w||1);return{s,L,p}}),tp=subs.reduce((a,x)=>a+x.p,0)/(subs.length||1);
return `<h1>🎓 العلامات والمعدل</h1><button onclick="editGr()">➕ علامة جديدة</button>${subs.length?`<div class="card" style="text-align:center"><div class="muted">المعدل العام (متوسط المواد)</div><div class="big">${tp.toFixed(1)}%</div><div>≈ ${gpa4(tp).toFixed(1)} من 4.0 <small class="muted">(تحويل تقريبي، يختلف بين الجامعات)</small></div></div>`:""}`+subs.map(x=>`<div class="card"><h3>${esc(x.s)} — ${x.p.toFixed(1)}%</h3><div class="bar"><i style="width:${Math.min(100,x.p)}%"></i></div>${x.L.map(g=>`<div class="row" style="flex-wrap:nowrap;margin:6px 0"><div style="flex:1">${esc(g.n||"علامة")}: <b>${g.sc}/${g.mx}</b> <small class="muted">(وزن ${g.w||1})</small></div><button class="g" style="flex:0 0 auto" onclick="editGr(${g.id})">✏️</button><button class="g" style="flex:0 0 auto" onclick="delGr(${g.id})">🗑</button></div>`).join("")}</div>`).join("")||`<div class="card">لا علامات بعد. أضف علاماتك وسيُحسب معدلك تلقائياً.</div>`};
function editGr(i){const g=S.gr.find(x=>x.id==i)||{s:"",n:"",sc:"",mx:100,w:1};modal("🎓 علامة",[{k:"s",l:"المادة",v:g.s,list:1},{k:"n",l:"اسم الاختبار",v:g.n,p:"مثال: الامتحان النصفي"},{k:"sc",l:"العلامة",t:"number",v:g.sc},{k:"mx",l:"من",t:"number",v:g.mx},{k:"w",l:"الوزن (أهمية هذه العلامة داخل المادة)",t:"number",v:g.w}],v=>{const sc=+v.sc,mx=+v.mx||100;if(!v.s.trim()||v.sc===""||isNaN(sc)||sc<0||sc>mx){alert("تأكد من المادة والعلامة (يجب ألا تتجاوز العلامة الكاملة)");return false}const o={s:v.s.trim(),n:v.n.trim(),sc,mx,w:+v.w>0?+v.w:1};if(i)Object.assign(g,o);else S.gr.push({id:id(),...o});save();render()})}
function delGr(i){if(ask("حذف العلامة؟")){S.gr=S.gr.filter(x=>x.id!=i);save();render()}}
const wsd=()=>{const d=new Date();d.setDate(d.getDate()-wdi(d));return d.toLocaleDateString("en-CA")},wkHours=()=>S.sess.filter(s=>s.k=="study"&&s.day>=wsd()).reduce((a,s)=>a+s.sec,0)/3600;
const wgCard=()=>{const h=wkHours(),g=+S.wg||0,p=g?Math.min(100,h*100/g):0;return `<div class="card" style="text-align:center"><h3>🎯 هدف الأسبوع</h3>${g?`<div class="big">${h.toFixed(1)} / ${g} ساعة</div><div class="bar"><i style="width:${p}%"></i></div><small class="muted">${h>=g?"أنجزت هدفك، بارك الله فيك 🎉":"بقي "+(g-h).toFixed(1)+" ساعة"}</small>`:`<p class="muted">لم تحدد هدفاً أسبوعياً بعد.</p>`}<div style="margin-top:8px"><button class="g" onclick="setWG()">${g?"تعديل الهدف":"تحديد هدف الساعات"}</button></div></div>`};
function setWG(){modal("🎯 هدف الساعات الأسبوعي",[{k:"h",l:"عدد ساعات الدراسة المطلوبة في الأسبوع",t:"number",v:S.wg||10}],v=>{const h=+v.h;if(!(h>=0&&h<=168)){alert("أدخل رقماً بين 0 و168");return false}S.wg=h;save();render()})}
const _h2=R.home;R.home=()=>_h2().replace('<div class="grid">',wgCard()+nextCls()+'<div class="grid">');
const _sx2=R.stats;R.stats=()=>_sx2().replace('<h1>📊 الإحصائيات</h1>','<h1>📊 الإحصائيات</h1>'+wgCard());
const _bs=buildSched;buildSched=function(){const out=_bs();if(S.rem.tasks){const iso=d=>d.toLocaleDateString("en-CA");for(let o=0;o<2;o++){const d=new Date();d.setDate(d.getDate()+o);S.tt.filter(x=>x.d==wdi(d)).forEach(x=>{const[h,m]=x.f.split(":"),t=new Date(d);t.setHours(+h,+m-10,0,0);out.push({id:"c"+iso(d)+x.id,t:t.getTime(),title:"🏫 حصة "+x.s,body:"تبدأ بعد 10 دقائق"+(x.r?" — "+x.r:"")+". استعد بإتقان ✨"})})}}return out};
function gSetup(){modal("🔐 تسجيل الدخول بحساب Google",[{k:"c",l:"معرّف Google (Client ID)",p:"xxxx.apps.googleusercontent.com"}],v=>{const c=v.c.trim();if(!/^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$/i.test(c)){alert("المعرّف غير صحيح. انسخه كاملاً من Google Cloud.");return false}S.cid=c;save();render()})}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window._ip=e});
const _s6=R.settings;R.settings=()=>_s6()+(window._ip?`<div class="card"><h3>📲 تثبيت التطبيق</h3><p class="muted">ثبّت مِرقَام على شاشتك الرئيسية ليعمل كتطبيق مستقل.</p><button onclick="_ip.prompt()">تثبيت</button></div>`:"");
render();setTimeout(()=>$("#sp").classList.add("hide"),2800);
const askName=()=>{if(!S.name)modal("أهلاً بك في مِرقَام",[{k:"n",l:"ما اسمك؟"}],v=>{S.name=v.n.trim();save();render()})};

setTimeout(()=>{if(locked)return;if(!S.toured)tour();else askName()},3300);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
